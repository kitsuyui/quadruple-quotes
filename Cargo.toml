[workspace]
members = ["crates/core", "crates/wasm", "crates/analysis-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kitsuyui/quadruple-quotes"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
typos = "0.10.44"
typos-dict = "0.10.0"
unicase = "2"
pulldown-cmark = "0.13"

[profile.release]
lto = true
opt-level = "s"
