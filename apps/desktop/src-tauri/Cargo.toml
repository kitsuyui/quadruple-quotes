[package]
name = "quadruple-quotes-desktop"
version = "0.1.0"
description = "Desktop host for Quadruple Quotes"
edition = "2021"

[lib]
name = "quadruple_quotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[workspace]
